<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>360° Projector Turntable Tracker (BLE)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
      color: #fff;
    }

    /* Full-bleed container for the YouTube IFrame */
    #player-wrap {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 1;
      background: #000;
    }
    #player, #player-wrap iframe {
      width: 100% !important;
      height: 100% !important;
      border: 0;
      display: block;
    }

    /* Transparent overlay so taps on the video wake the HUD instead of being swallowed by the iframe */
    #touch-shield {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: transparent;
    }

    /* Floating Control HUD */
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 20;
      background: rgba(15, 15, 20, 0.88);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      max-width: 330px;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    #hud.auto-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    input, button {
      padding: 7px 9px;
      margin: 4px 0;
      border-radius: 5px;
      border: none;
      font-size: 13px;
    }
    input { width: 100%; background: #222; color: #fff; border: 1px solid #444; }
    button { background: #2563eb; color: #fff; font-weight: bold; cursor: pointer; width: 100%; }
    button.secondary { background: #374151; }
    .row { display: flex; gap: 6px; }
    .url-row input { flex: 1; }
    .url-row button { width: auto; white-space: nowrap; }
    #preview-wrap {
      position: relative;
      width: 160px;
      height: 120px;
      margin-top: 8px;
      background: #111;
      border-radius: 6px;
      overflow: hidden;
    }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #target-line { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #10b981; }
    #dot {
      position: absolute;
      top: 50%;
      width: 10px;
      height: 10px;
      background: #ef4444;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      display: none;
    }
    #status { font-size: 11px; color: #9ca3af; margin-top: 6px; line-height: 1.35; }
  </style>
</head>
<body>

  <div id="player-wrap">
    <div id="player"></div>
  </div>

  <!-- Intercepts screen taps to wake the HUD -->
  <div id="touch-shield"></div>

  <div id="hud">
    <div class="row url-row">
      <input id="ytInput" type="text" value="" placeholder="Paste YouTube URL or Video ID" />
      <button id="loadVidBtn" class="secondary">Load</button>
    </div>
    <div class="row">
      <button id="connectBtn">Connect BLE & Start</button>
      <button id="invertBtn" class="secondary">Invert Motor</button>
    </div>
    <div class="row">
      <button id="fsBtn" class="secondary">Fullscreen</button>
      <button id="unmuteBtn" class="secondary">Unmute</button>
      <button id="hideHudBtn" class="secondary">Hide Now</button>
    </div>
    <div id="preview-wrap">
      <video id="webcam" autoplay playsinline muted></video>
      <div id="target-line"></div>
      <div id="dot"></div>
    </div>
    <div id="status">Status: Paste a YouTube URL & tap Connect BLE & Start</div>
  </div>

  <script type="module">
    import { FaceDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
    const MOTOR_CHAR_UUID = "19b10001-e8f2-537e-4f6c-d104768a1214";

    let ytApiReady = false;
    let ytPlayer = null;
    let pendingVideoId = null;
    let motorChar = null;
    let faceDetector = null;
    let motorDirection = 1;
    let currentYaw = 0;
    let isTracking = false;
    let lastBleSend = 0;
    let hudHideTimeout = null;

    const video = document.getElementById("webcam");
    const statusEl = document.getElementById("status");
    const dotEl = document.getElementById("dot");
    const ytInputEl = document.getElementById("ytInput");
    const hudEl = document.getElementById("hud");
    const touchShieldEl = document.getElementById("touch-shield");

    // HUD Auto-Hide & Tap-to-Wake Logic
    function showHudAndScheduleHide() {
      hudEl.classList.remove("auto-hidden");
      clearTimeout(hudHideTimeout);

      if (isTracking) {
        hudHideTimeout = setTimeout(() => {
          if (document.activeElement !== ytInputEl) {
            hudEl.classList.add("auto-hidden");
          }
        }, 5000);
      }
    }

    function hideHudImmediately() {
      clearTimeout(hudHideTimeout);
      hudEl.classList.add("auto-hidden");
    }

    touchShieldEl.addEventListener("pointerdown", showHudAndScheduleHide);
    hudEl.addEventListener("pointerdown", showHudAndScheduleHide);
    ytInputEl.addEventListener("input", showHudAndScheduleHide);
    ytInputEl.addEventListener("blur", showHudAndScheduleHide);

    // Extract 11-character Video ID from full YouTube URLs or raw IDs
    function extractYouTubeId(input) {
      const trimmed = input.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;

      const patterns = [
        /(?:youtube\.com\/watch\?.*v=)([a-zA-Z0-9_-]{11})/,
        /(?:youtu\.be\/)([a-zA-Z0-9_-]{11})/,
        /(?:youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
        /(?:youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/,
        /(?:youtube\.com\/live\/)([a-zA-Z0-9_-]{11})/
      ];

      for (const regex of patterns) {
        const match = trimmed.match(regex);
        if (match && match[1]) return match[1];
      }
      return null;
    }

    function initOrLoadPlayer(videoId) {
      if (window.location.protocol === "file:") {
        statusEl.textContent = "Error: Host over HTTPS/localhost (YouTube blocks file:// embeds).";
        return;
      }

      if (!ytApiReady) {
        pendingVideoId = videoId;
        statusEl.textContent = "Loading YouTube API...";
        return;
      }

      if (!ytPlayer) {
        ytPlayer = new YT.Player("player", {
          width: "100%",
          height: "100%",
          videoId: videoId,
          playerVars: {
            autoplay: 1,
            mute: 1,
            controls: 0,
            modestbranding: 1,
            rel: 0,
            playsinline: 1,
            origin: window.location.origin
          },
          events: {
            onReady: (e) => {
              e.target.playVideo();
              if (ytPlayer.setSphericalProperties) {
                ytPlayer.setSphericalProperties({ enableOrientationSensor: false, yaw: 0 });
              }
              statusEl.textContent = `Playing video ID: ${videoId}`;
            },
            onError: (e) => {
              statusEl.textContent = `YouTube Player Error ${e.data} (Video may disable embedding)`;
            }
          }
        });
      } else if (ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(videoId);
        currentYaw = 0;
        if (ytPlayer.setSphericalProperties) {
          ytPlayer.setSphericalProperties({ enableOrientationSensor: false, yaw: 0 });
        }
        statusEl.textContent = `Loaded video ID: ${videoId}`;
      }
    }

    function loadVideoFromInput(silentIfEmpty = false) {
      const raw = ytInputEl.value.trim();
      if (!raw) {
        if (!silentIfEmpty) statusEl.textContent = "Paste a YouTube URL or Video ID first.";
        return false;
      }
      const videoId = extractYouTubeId(raw);
      if (!videoId) {
        statusEl.textContent = "Invalid YouTube URL or Video ID.";
        return false;
      }
      initOrLoadPlayer(videoId);
      return true;
    }

    // Load YouTube IFrame API without loading any default video
    function onApiReady() {
      ytApiReady = true;
      if (pendingVideoId) {
        initOrLoadPlayer(pendingVideoId);
        pendingVideoId = null;
      }
    }

    if (window.YT && window.YT.Player) {
      onApiReady();
    } else {
      window.onYouTubeIframeAPIReady = onApiReady;
      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);
    }

    // MediaPipe Face Detector
    async function initDetector() {
      statusEl.textContent = "Status: Loading AI tracker...";
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      faceDetector = await FaceDetector.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
          delegate: "GPU"
        },
        runningMode: "VIDEO"
      });
    }

    // Start Phone Front Camera
    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: 320, height: 240 },
        audio: false
      });
      video.srcObject = stream;
      await new Promise((res) => (video.onloadedmetadata = res));
    }

    // Connect to XIAO via Web Bluetooth using namePrefix filter
    async function connectBLE() {
      if (!navigator.bluetooth) {
        statusEl.textContent = "Web Bluetooth not supported in this browser.";
        return;
      }
      statusEl.textContent = "Scanning for 360-Turntable...";
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: "360" }],
        optionalServices: [SERVICE_UUID]
      });

      device.addEventListener("gattserverdisconnected", () => {
        motorChar = null;
        statusEl.textContent = "BLE Disconnected";
        showHudAndScheduleHide();
      });

      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      motorChar = await service.getCharacteristic(MOTOR_CHAR_UUID);
      statusEl.textContent = "Connected to 360-Turntable (BLE)";
    }

    function sendMotorPWM(pwm) {
      const now = performance.now();
      if (!motorChar || now - lastBleSend < 33) return;
      lastBleSend = now;

      const payload = new Int16Array([pwm]);
      motorChar.writeValueWithoutResponse(payload).catch(() => {});
    }

    // Tracking & Motor Loop
    let lastVideoTime = -1;
    function trackLoop() {
      if (!isTracking) return;

      if (faceDetector && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const result = faceDetector.detectForVideo(video, performance.now());

        if (result.detections.length > 0) {
          const box = result.detections[0].boundingBox;
          const centerX = (box.originX + box.width / 2) / video.videoWidth;
          const mirroredX = 1.0 - centerX;

          dotEl.style.display = "block";
          dotEl.style.left = `${mirroredX * 100}%`;

          const error = mirroredX - 0.5;
          const deadzone = 0.06;

          let pwm = 0;
          if (Math.abs(error) > deadzone) {
            pwm = Math.round(error * 420 * motorDirection);
            pwm = Math.max(-255, Math.min(255, pwm));

            currentYaw = (currentYaw + error * 2.5 + 360) % 360;
            if (ytPlayer && ytPlayer.setSphericalProperties) {
              ytPlayer.setSphericalProperties({ yaw: currentYaw, enableOrientationSensor: false });
            }
          }

          sendMotorPWM(pwm);
          statusEl.textContent = `Offset: ${(error * 100).toFixed(1)}% | PWM: ${pwm}`;
        } else {
          dotEl.style.display = "none";
          sendMotorPWM(0);
          statusEl.textContent = "No viewer detected (Stopped)";
        }
      }
      requestAnimationFrame(trackLoop);
    }

    document.getElementById("loadVidBtn").addEventListener("click", () => loadVideoFromInput(false));
    ytInputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") loadVideoFromInput(false);
    });
    ytInputEl.addEventListener("paste", () => {
      setTimeout(() => loadVideoFromInput(true), 50);
    });

    document.getElementById("connectBtn").addEventListener("click", async () => {
      try {
        loadVideoFromInput(true);
        await connectBLE();
        if (!faceDetector) await initDetector();
        await startCamera();
        isTracking = true;
        trackLoop();
        showHudAndScheduleHide();
      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
      }
    });

    document.getElementById("invertBtn").addEventListener("click", () => {
      motorDirection *= -1;
      statusEl.textContent = `Motor polarity: ${motorDirection === 1 ? "Normal" : "Inverted"}`;
    });

    document.getElementById("unmuteBtn").addEventListener("click", () => {
      if (ytPlayer && ytPlayer.unMute) {
        ytPlayer.unMute();
        ytPlayer.playVideo();
      }
    });

    document.getElementById("fsBtn").addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    });

    document.getElementById("hideHudBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      hideHudImmediately();
    });
  </script>
</body>
</html>
